<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>洗腎室工具箱</title>
<style>
:root{--teal:#0d7377;--teal2:#e1f1f0;--line:#d4e4e4;--text:#16232a;--muted:#7a9a9a}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f0f5f5;color:var(--text)}
.wrap{max-width:640px;margin:auto;padding:20px 16px 60px}
.header{background:var(--teal);color:#fff;border-radius:20px;padding:26px 22px;text-align:center}
.header h1{margin:0;font-size:1.5em}
.header .sub{opacity:.9;margin-top:8px;font-size:.9em}
.cards{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.card{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;text-decoration:none;color:var(--text);box-shadow:0 3px 10px rgba(0,0,0,.04);transition:transform .1s}
.card:active{transform:scale(.98)}
.card .icon{font-size:32px;flex-shrink:0;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--teal2);border-radius:14px}
.card .info{flex:1}
.card .title{font-size:1.1em;font-weight:800;color:var(--teal)}
.card .desc{font-size:.85em;color:var(--muted);margin-top:4px;line-height:1.5}
.footer{margin-top:28px;text-align:center;font-size:.8em;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
<h1>🩺 洗腎室工具箱</h1>
<div class="sub">日常照護、衛教說明、檢驗數值查詢，開啟手機即可使用</div>
</div>

<div class="cards">
<a class="card" href="交班系統.html.md">
<div class="icon">🔄</div>
<div class="info"><div class="title">洗腎室交班系統</div><div class="desc">病人任務清單、交班紀錄與進度追蹤</div></div>
</a>
<a class="card" href="education.html">
<div class="icon">📘</div>
<div class="info"><div class="title">血液透析衛教手冊</div><div class="desc">衛教病人時開啟，涵蓋十大主題、可搜尋、字級可調整</div></div>
</a>
<a class="card" href="lab-values.html">
<div class="icon">🧪</div>
<div class="info"><div class="title">透析數值速查</div><div class="desc">電解質、骨礦物質代謝、貧血鐵代謝、適足性、營養等檢驗目標值對照</div></div>
</a>
</div>

<div class="footer">僅供院內臨床與衛教使用參考，實際處置仍以醫囑為準。</div>
</div>
</body>
</html>
